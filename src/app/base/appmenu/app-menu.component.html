<div class="row m-0 dxc-appmenu-vpnav app-menu" #snavRef>
    <div class="col-lg-10 text-left nav">
        <ng-container *ngFor="let menu of entries">
            <div ngbDropdown class="d-inline-block nav-menu">
                <button class="btn dxc-text-clear100" [id]="'dropdownBasic'+menu.offset" ngbDropdownToggle>
                    <dxc-icon *ngIf="menu.icon!=null" [model]="menu.icon"></dxc-icon>
                    {{ menu.label  }}
                </button>
                <div ngbDropdownMenu class="nav-menu-dropdown" aria-labelledby="dropdownBasic1" >
                    <ng-container *ngFor="let item of menu.submenu">
                        <ng-container *ngIf="item.type==null; then buttonEntry else separator"></ng-container>
                        <ng-template #separator>
                            <!--div class="menu-separator">&nbsp;</div>-->
                            <div class="dropdown-divider"></div>
                        </ng-template>
                        <ng-template #buttonEntry>
                            <ng-container *ngIf="item.enabled">
                                <button [ngClass]="{ 'disabled': (item.enabled==false) }" (click)="onItemSelect(item,$event)"  ngbDropdownItem>
                                    <dxc-icon *ngIf="item.icon" [model]="item.icon"></dxc-icon>
                                    {{ item.label }}
                                </button>
                            </ng-container>
                            <ng-container *ngIf="!item.enabled">
                                <button class="dropdown-item disabled">
                                    <dxc-icon *ngIf="item.icon" [model]="item.icon"></dxc-icon>
                                    {{ item.label }}
                                </button>
                            </ng-container>

                        </ng-template>
                    </ng-container>
                </div>
            </div>
        </ng-container>
    </div>
    <div class="col-lg-2 text-right nav-options">
        <ng-content select="[opts]"></ng-content>
    </div>
</div>
