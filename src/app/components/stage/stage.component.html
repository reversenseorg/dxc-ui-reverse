<style>
  body {
    background-color:#333;
  }
</style>
<div class="overall" id="bodyCtn" #mainContainer>
  <app-navbar *ngIf="webNav" [parent]="this" ></app-navbar>
  <div class="container-fluid row app-superviewport" id="appMiddleCtn" #middleCtn>
    <div class="app-explorer-z" id="appSuperExpl" #explContainer>
      <app-explorer [parent]="this" [explorers]="explorers"></app-explorer>
    </div>
    <div class="app-viewp-z" id="appSuperViewport" #viewportContainer>
      <app-viewport [parent]="this" [controller]="viewport"></app-viewport>
      <!--<router-outlet name="main-viewport"></router-outlet>-->
    </div>
    <!--<router-outlet name="rightside-panel"></router-outlet>-->
  </div>
  <app-terminal [parent]="this" [statebarHeight]="statebarHeight" [terminals]="terminals" id="appBottomCtn"></app-terminal>
  <dxc-statebar [height]="statebarHeight" #statebar>
    <app-subnavbar [type]="'navbar'" [height]="statebarHeight">
      <ng-container main>
          <dxs-project-status></dxs-project-status>
        <app-subnavbar-btn *ngIf="project && project.device" [icon]="icons['DEFAULT_DEVICE']" [height]="statebarHeight" (click)="showDevice(project.device)">{{ project.device.id }}&nbsp;[{{ project.device.model }}]</app-subnavbar-btn>
        <app-subnavbar-btn *ngIf="project" [icon]="gIcons['PACKAGE']" [height]="statebarHeight">{{ project.package }}</app-subnavbar-btn>
        <app-subnavbar-btn *ngIf="conn" [icon]="gIcons['NETWORK_OK']" [height]="statebarHeight"><ng-container *ngIf="conn.user">{{ conn.user.username }}</ng-container>:{{ conn.name }}</app-subnavbar-btn>
        <app-subnavbar-btn [height]="statebarHeight" [icon]="gIcons['BELL']">&nbsp;Info&nbsp;&nbsp;<span *ngIf="alertCtr > 0" class="badge rounded-pill  text-bg-danger">{{ alertCtr }}</span></app-subnavbar-btn>
      </ng-container>
    </app-subnavbar>
  </dxc-statebar>
</div>

<router-outlet></router-outlet>

<app-modal-progress [cancelable]="true" [progress$]="progress$" [title]="progressTitle" [progress]="100" [width]="450" [cancel]="onModalProgressCancel" [closable]="true" [controller]="this" [mainController]="this"></app-modal-progress>
<dxc-modal-search [mainController]="this"></dxc-modal-search>
<dxc-modal-edit-rule *ngIf="getController('ctrl:privacy')!=null" [controller]="getController('ctrl:privacy')" [title]="'Merlin search'"></dxc-modal-edit-rule>
<dxc-modal-alert [mainController]="this"></dxc-modal-alert>
