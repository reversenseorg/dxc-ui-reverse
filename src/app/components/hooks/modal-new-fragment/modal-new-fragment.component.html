<app-modal-base [name]="'newHookFrag'" [closable]="true"  [width]="500" [height]="400" [mainController]="controller.app" >
  <div head class="dxc-modal-header">{{ mode }} a new fragment of code</div>
  <div body class="dxc-modal-body p-1">
      <p class="dxc-text-100 mb-2 p-2">
        To edit an existing hook without breaking future improvements, you must place your custom code into a separate code fragment instead of the generated code.
      </p>
      <div class="dxc-form dxc-text-100">
        <div class="row no-gutters">
          <div class="col-6">Position</div>
          <div class="col-6 pl-1">Priority</div>
        </div>
        <div class="row no-gutters mb-2">
          <div class="col-6">
            <select [(ngModel)]="pos" name="pos" id="pos" class="dxc-input">
              <option value="before">before</option>
              <option value="after">after</option>
              <option value="replace">replace</option>
            </select>
          </div>
          <div class="col-6 pl-1">
            <input type="number" name="weight" id="weight" class="pl-2" value="-1" style="width:100%" [(ngModel)]="weight">
          </div>
        </div>
        <div class="row no-gutters mb-1">
          <div class="col-12">
            Name <span class="text-danger">*</span><span *ngIf="_update" class="text-danger">(cannot be modified, re-create to replace)</span>
            <br> <input type="text" [disabled]="_update" [(ngModel)]="name" name="uid" id="uid"  class="dxc-frm-input pl-2" style="width:100%">
          </div>
        </div>
        <div class="row no-gutters">
          <div class="col-12">
            Description<br>
            <textarea rows="3" [(ngModel)]="descr"  name="descr" id="descr"  class="dxc-frm-input p-2" style="width:100%"></textarea>
          </div>
        </div>
      </div>
  </div>
  <div footer>
    <button class="dxc-frm-btn" (click)="close()">Cancel</button>
    <button class="dxc-frm-btn default" (click)="confirm()">
      <dxc-icon [model]="gIcons['GEN_HOOK']"></dxc-icon>&nbsp;Save
    </button>
  </div>
</app-modal-base>
