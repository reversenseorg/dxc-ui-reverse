<app-modal-base [name]="'passwd_auth'"  [preventEscClose]="true"   [closable]="false" [width]="300" [height]="200" [mainController]="mainController">
  <div head class="dxc-modal-header">
    Server logout
  </div>
  <ng-container options>
    <dxc-helper-btn [docid]="'srv.logout'"></dxc-helper-btn>
  </ng-container>
  <div body class="dxc-modal-body pt-1">
      <div class="row no-gutters">
        <div class="col-lg-12 text-center dxc-text-clear100"><i>Multiple connections are open, please select the connection to close.</i></div>
      </div>
    <div class="row no-gutters pt-1 pl-1">
      <div class="col-lg-2  pr-2 text-right dxc-text-clear75">
        <dxc-icon [model]="icons['SERVER']"></dxc-icon>
      </div>
      <div class="col-lg-10  dxc-text-clear100 ">
        <select name="server" [(ngModel)]="server" placeholder="Select a server" class="dxc-input" style="width:200px">
          <option *ngFor="let c of conns; trackBy: connIdentify" [value]="c.name">{{ c.name }}</option>
        </select>
      </div>
    </div>

    </div>
    <div footer>
        <button class="dxc-frm-btn" (click)="close()">Cancel</button>
        <button class="dxc-frm-btn default" (click)="doLogout()">
          <dxc-icon [model]="icons['UNLOCK']"></dxc-icon>&nbsp;Logout
        </button>
    </div>
</app-modal-base>
