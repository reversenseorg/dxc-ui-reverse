<div class="results" style="height:220px; background-color: #2b2b2b; color:white; overflow:auto;">
  <ng-container *ngIf="results.length>0;else noResults">
    <div class="row results" *ngFor="let e of results; let offset=index;" (dblclick)="open($event, e)" (contextmenu)="displayCtxMenu($event, e)" (click)="selectResult(e, offset)" [class.active]="selectedResult==offset">

      <ng-container *ngIf="e.__==NODE_TYPES.METHOD">
        <div class="col-lg-1">
          <ng-container *ngIf="e.name!='<clinit>'">
            <span class="badge padge-pill badge-success" *ngIf="e.enabled">ON</span>
            <span class="badge padge-pill badge-danger" *ngIf="!e.enabled">OFF</span>
          </ng-container>
        </div>
        <!--<div class="col-lg-1">
          <dxc-icon *ngIf="e.name=='<clinit>'" [model]="cIcons.STATICB"></dxc-icon>
          <dxc-icon *ngIf="e.name=='<init>'" [model]="cIcons.NEW"></dxc-icon>
          <dxc-icon *ngIf="e.name=='<init>'" [model]="cIcons.NEW"></dxc-icon>
        </div>-->
        <div class="col-lg-6" (dblclick)="openView(e)">
          <dxc-preview [length]="50" [data]="e.__callSignature__"></dxc-preview>
        </div>
        <div class="col-lg-5" style="white-space: nowrap; text-align: right;color:#bbb;" [ngClass]="{ 'text-success': TAGS.INTERNAL&&TAGS.INTERNAL.match(e), 'text-warning': TAGS.DYNAMIC&&TAGS.DYNAMIC.match(e)}">
          {{ e.enclosingClass }}
          &nbsp;
          <!--<dxc-icon *ngIf="e.tags.indexOf('di')>-1" [model]="gIcons.ANDROID"></dxc-icon>
          <dxc-icon *ngIf="e.tags.indexOf('di')==-1" [model]="gIcons.WINDOW"></dxc-icon>-->
        </div>
      </ng-container>

      <ng-container *ngIf="e.__==NODE_TYPES.CLASS">
        <div class="col-lg-7" (dblclick)="openView(e)">
          <span class="text-nowrap"><dxc-icon [model]="cIcons.CLASS"></dxc-icon>&nbsp;{{ e.name }}</span>
        </div>
        <div class="col-lg-5" style="white-space: nowrap; text-align: right;color:#bbb;" [ngClass]="{ 'text-success': TAGS.INTERNAL&&TAGS.INTERNAL.match(e), 'text-warning': TAGS.DYNAMIC&&TAGS.DYNAMIC.match(e)}">
          &nbsp;&nbsp;
          <!--<dxc-icon *ngIf="e.tags.indexOf('di')>-1" [model]="gIcons.ANDROID"></dxc-icon>
          <dxc-icon *ngIf="e.tags.indexOf('di')==-1" [model]="gIcons.WINDOW"></dxc-icon>-->
        </div>
      </ng-container>

      <ng-container *ngIf="e.__==NODE_TYPES.FIELD">
        <div class="col-lg-7">
          <dxc-icon [model]="cIcons.FIELD"></dxc-icon>&nbsp; {{ e.name }}
        </div>
        <div class="col-lg-5" style="white-space: nowrap; text-align: right;color:#bbb;" [ngClass]="{ 'text-success': TAGS.INTERNAL&&TAGS.INTERNAL.match(e), 'text-warning': TAGS.DYNAMIC&&TAGS.DYNAMIC.match(e)}">
          &nbsp;&nbsp;
          <!--<dxc-icon *ngIf="e.tags.indexOf('di')>-1" [model]="gIcons.ANDROID"></dxc-icon>
          <dxc-icon *ngIf="e.tags.indexOf('di')==-1" [model]="gIcons.WINDOW"></dxc-icon>-->
        </div>
      </ng-container>

      <ng-container *ngIf="e.__==NODE_TYPES.STRING">
        <div class="col-lg-1"  (dblclick)="openView(e)">
          <!--<ng-container *ngFor="let t of e.tags">
            <dxc-meta [label]="t" [css]="'badge-warning'"></dxc-meta>
          </ng-container>-->
        </div>
        <div class="col-lg-5" (dblclick)="openView(e)">
          <dxc-preview [type]="'s'" [data]="e.value" [length]="32"></dxc-preview>
        </div>
        <div class="col-lg-4" style="white-space: nowrap; text-align: right;color:#bbb;">
          -
        </div>
      </ng-container>

      <ng-container *ngIf="e.__==NODE_TYPES.ANDROID_ACTIVITY">
        <div class="col-lg-12" (dblclick)="openView(e)">
          <dxc-icon [model]="tIcons.ACTIVITY"></dxc-icon>&nbsp; {{ e.name }}

          <ng-container *ngFor="let t of e.__tag">
            <span class="badge badge-pill badge-danger">{{ t }}</span>&nbsp;
          </ng-container>

          <span *ngIf="e.intentFilters.length>0" class="badge badge-pill badge-info">intent filters</span>&nbsp;
        </div>
      </ng-container>

      <ng-container *ngIf="e.__==NODE_TYPES.ANDROID_RECEIVER">
        <div class="col-lg-12" (dblclick)="openView(e)">
          <dxc-icon [model]="tIcons.RECEIVER"></dxc-icon>&nbsp; {{ e.name }}

          <ng-container *ngFor="let t of e.__tag">
            <span class="badge badge-pill badge-danger">{{ t }}</span>&nbsp;
          </ng-container>

          <span *ngIf="e.intentFilters.length>0" class="badge badge-pill badge-info">intent filters</span>&nbsp;
        </div>
      </ng-container>


      <ng-container *ngIf="e.__==NODE_TYPES.ANDROID_SERVICE">
          <div class="col-lg-12" (dblclick)="openView(e)">
            <dxc-icon [model]="tIcons.RECEIVER"></dxc-icon>&nbsp; {{ e.name }}

            <ng-container *ngFor="let t of e.__tag">
              <span class="badge badge-pill badge-danger">{{ t }}</span>&nbsp;
            </ng-container>

            <span *ngIf="e.intentFilters.length>0" class="badge badge-pill badge-info">intent filters</span>&nbsp;
          </div>
      </ng-container>
<!--
      <ng-container *ngIf="e._t=='tas'">
        <div class="col-lg-12" (dblclick)="openView(e)">
          <dxc-icon [model]="tIcons.SERVICE"></dxc-icon>&nbsp; {{ e.name }}

          <ng-container *ngFor="let t of e.__tag">
            <span class="badge badge-pill badge-danger">{{ t }}</span>&nbsp;
          </ng-container>

          <span *ngIf="e.intentFilters.length>0" class="badge badge-pill badge-info">intent filters</span>&nbsp;
        </div>
      </ng-container>
-->
      <ng-container *ngIf="e.__==NODE_TYPES.ANDROID_PROVIDER">
        <div class="col-lg-12" (dblclick)="openView(e)">
          <dxc-icon [model]="tIcons.PROVIDER"></dxc-icon>&nbsp; {{ e.name }}

          <ng-container *ngFor="let t of e.__tag">
            <span class="badge badge-pill badge-danger">{{ t }}</span>&nbsp;
          </ng-container>

          <span *ngIf="e.intentFilters.length>0" class="badge badge-pill badge-info">intent filters</span>&nbsp;
        </div>
      </ng-container>

<!--      <ng-container *ngIf="e._t=='x'">-->
      <ng-container *ngIf="e.__==NODE_TYPES.ANDROID_PROVIDER">
        <!--<div class="col-lg-1">
          <ng-container *ngIf="e.name!='<clinit>'">
            <span class="badge padge-pill badge-success" *ngIf="e.enabled">ON</span>
            <span class="badge padge-pill badge-danger" *ngIf="!e.enabled">OFF</span>
          </ng-container>
          <dxc-icon *ngIf="e.name=='<clinit>'" [model]="cIcons.STATICB"></dxc-icon>
          <dxc-icon *ngIf="e.name=='<init>'" [model]="cIcons.NEW"></dxc-icon>
        </div>-->
        <div class="col-lg-6" (dblclick)="openView(e,0)">
          <dxc-preview [length]="80" [data]="e.caller"></dxc-preview>
        </div>
        <div class="col-lg-6" (dblclick)="openView(e,1)">
          <dxc-preview [length]="80" [data]="e.callee"></dxc-preview>
        </div>
      </ng-container>


    </div>
  </ng-container>
  <ng-template #noResults>
    <div class="row results">
      <div class="col-lg-12 text-center text-warning">
        <dxc-icon [model]="gIcons.CROSS"></dxc-icon>&nbsp;No results.
      </div>
    </div>
  </ng-template>
</div>
