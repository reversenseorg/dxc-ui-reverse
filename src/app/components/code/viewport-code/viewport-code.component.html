<div [class.dxc-hidden]="(parent.activeCtn==null) || (id!=parent.activeCtn.id)"  class="container-fluid viewport-code">

    <ng-container [ngSwitch]="data.__">
        <app-viewport-code-meth *ngSwitchCase="NodeInternalType.METHOD" [direct]="opts.direct" [data]="data" [width]="size.width" [height]="size.height" [parent]="this.parent" [controller]="controller"></app-viewport-code-meth>
        <app-viewport-code-class *ngSwitchCase="NodeInternalType.CLASS" [direct]="opts.direct" [data]="data" [width]="size.width" [height]="size.height" [parent]="this.parent" [controller]="controller"></app-viewport-code-class>
        <app-viewport-code-package *ngSwitchCase="NodeInternalType.PACKAGE" [direct]="opts.direct" [data]="data" [width]="size.width" [height]="size.height" [parent]="this.parent" [controller]="controller"></app-viewport-code-package>
        <app-viewport-code-field *ngSwitchCase="NodeInternalType.FIELD" [direct]="opts.direct" [data]="data" [width]="size.width" [height]="size.height"  [parent]="this.parent" [controller]="controller"></app-viewport-code-field>
        <app-viewport-code-string *ngSwitchCase="NodeInternalType.STRING" [direct]="opts.direct" [data]="data" [width]="size.width" [height]="size.height"  [parent]="this.parent" [controller]="controller"></app-viewport-code-string>
    </ng-container>
