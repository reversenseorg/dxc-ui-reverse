<div class="container-fluid viewport-class">
  <!--<app-subnavbar [type]="'navbar'" [navbar]="topNav" [parent]="this">
    <ng-container main>
      <app-subnavbar-btn [icon]="gIcons['JAVA']">Implemented by</app-subnavbar-btn>
      <app-subnavbar-btn [icon]="gIcons['LIST']">Instances</app-subnavbar-btn>
      <app-subnavbar-btn [icon]="gIcons['PERM']">Permissions</app-subnavbar-btn>
      <app-subnavbar-btn [icon]="gIcons['HOOKS']">Hooks</app-subnavbar-btn>
    </ng-container>
    <ng-container options>
      <app-subnavbar-btn  [icon]="gIcons['FILE']" [position]="'right'">Save</app-subnavbar-btn>
    </ng-container>
  </app-subnavbar>-->


  <span><b>Java class : </b> {{ data.name }} </span><br>
  <span *ngIf="data.source" class="text-warning">
      &nbsp;<fa-icon [icon]="['fas','play']" class="text-warning icon-sm"></fa-icon>
      &nbsp;<b>Source file : </b> <span class="browsable" (click)="controller.locateAppFile(data.source)">{{ data.source }}</span>
    </span><br>
  <span>
      &nbsp;<fa-icon [icon]="['fas','play']" class="text-warning icon-sm"></fa-icon>
      &nbsp;<b>Scope : </b>
      <span class="browsable" (click)="controller.locateAppFile(data.source)">{{ data.source }}</span>
      <!--<span *ngIf="data.tags.di" class="browsable" (click)="controller.filterCodeExplorer('android_api')">{{ data.source }}</span>
      <span *ngIf="" class="browsable" (click)="controller.locateAppFile(data.source)">{{ data.source }}</span>-->
    </span>


  <app-viewport-splitted [controller]="controller" [parent]="this" [flex]="true" [leftWidth]="activeWidth">
    <ng-container nav-left>
      <app-subnavbar [type]="'navbar'"  [parent]="this">
        <ng-container main>
          <app-subnavbar-btn [active]="activeLeft=='md'"  (click)="showModel(80)">Details</app-subnavbar-btn>
          <app-subnavbar-btn [active]="activeLeft=='ct'"  [icon]="gIcons['LIST']" (click)="showContents(30)">Contents</app-subnavbar-btn>
          <app-subnavbar-btn [active]="activeLeft=='in'"  [icon]="gIcons['ANALYZE']" (click)="showInstance(50)">Instances</app-subnavbar-btn>
          <app-subnavbar-btn [active]="activeLeft=='pm'"  [icon]="gIcons['LOCK']" (click)="showPerm(50)">Permission</app-subnavbar-btn>
          <app-subnavbar-btn [active]="activeLeft=='io'"  [icon]="gIcons['FILE']" (click)="showIO(50)">I/O</app-subnavbar-btn>
        </ng-container>
      </app-subnavbar>
    </ng-container>
    <ng-container body-left>

      <div class="container-fluid" [class.dxc-hidden]="(activeLeft==null) || (activeLeft!='md')">
        <!--<ng-container *ngFor="let h of data.fields">
          <div class="row hook-row">
            <div class="col-lg-1">
              <dxc-icon [model]="h.enable? hIcons['UP'] : hIcons['DOWN']"></dxc-icon>
            </div>
            <div class="col-lg-9 hook-label">
              {{ h.method }}
            </div>
          </div>
        </ng-container>-->
      </div>

    </ng-container>
    <ng-container nav-right>
      <app-subnavbar [type]="'navbar'"  [parent]="this">
        <ng-container main></ng-container>
      </app-subnavbar>
    </ng-container>
    <ng-container body-right></ng-container>
  </app-viewport-splitted>

</div>
