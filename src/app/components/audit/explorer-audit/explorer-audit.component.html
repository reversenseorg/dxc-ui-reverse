<div [class.dxc-hidden]="offset != parent.active" class="container-fluid explorer-audit" #explAuditRef>
  <!-- <app-explorer-navbar [explorer]="this" ></app-explorer-navbar> -->
  <app-explorer-navbar [explorer]="this" id="{{ view.getNavID() }}" (menuItemClick)="onMenuItemClick($event)">
    <ng-container opts>
      <!--<button class="btn-option" (click)="refresh()"><fa-icon [icon]="['fas','cog']"></fa-icon></button>-->
      <button class="ml-2 btn-option" [ngbTooltip]="'Refresh'" (click)="refresh()"><fa-icon [icon]="['fas','rotate']"></fa-icon></button>
      <button class="ml-2 btn-option" [ngbTooltip]="'Scan'"><dxc-icon [model]="gIcons['PLAY']"></dxc-icon> </button>
    </ng-container>
  </app-explorer-navbar>

  <ul *ngIf="view.subnav != null" class="nav">
    <li *ngFor="let navBtn of view.subnav.menu.items">
      <fa-icon *ngIf="navBtn.icon && navBtn.icon.iconType==ICON_TYPE.ICON" [icon]="[navBtn.icon.type,navBtn.icon.name]"></fa-icon>
    </li>
  </ul>

  <div class="explorer-list-root" #explAuditCtnRef>

    <ng-container *ngIf="selected!='model'">
      <app-expandable-list>


        <ng-container *ngFor="let file of dataPool[selected]">

          <ng-template #expFileItem let-itemObj="item">

            <!--<span class="dxc-text-std" style="border-radius: 2rem; margin-top:2px; border: 2px solid white; padding: 1em;" *ngIf="itemObj.__==_NODE.ASSURANCE_MODEL" (contextmenu)="displayCtxMenu($event,'audit_model',itemObj)">
              <dxc-icon [model]="gIcons['LIBS']"></dxc-icon>
              <span class="margin-left:1em;font-size:1.2em;">{{ itemObj.name }}</span>
                <p class="dxc-text-blue">{{ itemObj.scannerID }}</p>
            </span>-->

            <span class="dxc-text-std" *ngIf="(itemObj.__!=_NODE.ASSURANCE_MODEL) && (itemObj.assessments!=null)" (contextmenu)="displayCtxMenu($event,'audit_rul',itemObj)">
              <dxc-icon [model]="gIcons['LIBS']" [color1]="'text-warning'"></dxc-icon>
              {{ itemObj.name }} [ {{ itemObj.assessments.length }} ]
            </span>

            <span class="dxc-text-std" *ngIf="(itemObj.__!=_NODE.ASSURANCE_MODEL) && (itemObj.rules!=null)" (contextmenu)="displayCtxMenu($event,'audit_rul',itemObj)">
              <dxc-icon [model]="gIcons['TARGET']" [color1]="'text-warning'"></dxc-icon>
              {{ itemObj.name }}
            </span>

          </ng-template>

          <app-expandable-item
            [itemTpl]="expFileItem"
            [item]="file"
            [provider]="this"
            [itemType]="file._t"
            [expandableFn]="isExpendable"
            (itemFocus)="onItemFocus($event)"
          >

          </app-expandable-item>

        </ng-container>

      </app-expandable-list>
    </ng-container>

    <ng-container *ngIf="selected=='model'">
      <ng-container *ngFor="let model of dataPool.model">
          <div class="row g-0 dxc-text-clear75 model-btn-grad" [ngClass]="{'focus':(focus==model.id)}" *ngIf="model.__==_NODE.ASSURANCE_MODEL" (click)="showModel(model,$event)" (contextmenu)="displayCtxMenu($event,'audit_model',model)">
            <div class="col-9 text-left">
              <span class="dxc-text-std ">{{ model.name }}</span>
                <p class="dxc-text-blue">{{ model.scannerID }}</p>
            </div>
          </div>
      </ng-container>
    </ng-container>


    <div *ngIf="!dataPool[selected]" class="text-center dxc-text-clear100 pt-4">
      There is not entry.
    </div>
  </div>


</div>


<app-context-menu [name]="'audit_rul'" [width]="300">
  <app-context-item [label]="'Open'" (click)="controller.open(ctxMenuState.subject,'xt')"></app-context-item>
  <app-context-item [label]="'Scan'" (click)="scanModel(ctxMenuState.subject)" ></app-context-item>
  <app-context-item [label]="'ReScan'" ></app-context-item>
</app-context-menu>

<app-context-menu [name]="'audit_model'" [width]="300">
  <app-context-item [label]="'Open'" (click)="controller.open(ctxMenuState.subject,'xt')"></app-context-item>
  <app-context-item [label]="'Scan'" [icon]="gIcons['PLAY']" (click)="scanModel(ctxMenuState.subject)" ></app-context-item>
</app-context-menu>


<dxc-modal-edit-rule [controller]="controller"></dxc-modal-edit-rule>
